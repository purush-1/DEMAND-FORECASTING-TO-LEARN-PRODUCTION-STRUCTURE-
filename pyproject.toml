[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecasting"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "demand-forecasting"
version = "0.1.0"
dependencies = [
    "fastapi==0.141.1",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "scikit-learn==1.9.1",
    "uvicorn==0.53.0",
    "xgboost==3.4.1",
]